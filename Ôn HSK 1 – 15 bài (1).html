["李文是什么人？","大学生",["老师","医生"]],["李文今年多大？","二十岁",["十岁","三十岁"]],["今天李文做什么？","在家休息",["上课","去医院"]]];

/* ===== HELPERS ===== */
const W=[];Object.entries(V).forEach(([l,s])=>s.split(";").forEach(x=>{const [h,p,m]=x.split("|");W.push({h,p,m,l:+l})}));
const $=s=>document.querySelector(s);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const py=h=>(W.find(w=>w.h===h)||{}).p;
const ws=l=>l>=100?W.filter(w=>w.l>3*(l-100)-3&&w.l<=3*(l-100)):W.filter(w=>w.l===l);
function vq(w,dir,words){
  const k=dir==="h2m"?"m":"h", seen=new Set([w[k]]), d=[];
  for(const x of sh(words.filter(x=>x.h!==w.h)).concat(sh(W))){ if(!seen.has(x[k])&&x.h!==w.h){seen.add(x[k]);d.push(x[k])} if(d.length>=3)break }
  const o=sh([w[k],...d]);
  return {q:dir==="h2m"?w.h:w.m,big:dir==="h2m",o,a:o.indexOf(w[k]),ex:`${w.h} · ${w.p} · ${w.m}`};
}
function mk(q,c,d,extra){const o=sh([c,...d]);return {q,o,a:o.indexOf(c),...extra}}
function mcq(el,qs,end){
  let i=0,sc=0;
  const show=()=>{
    if(i>=qs.length){el.innerHTML=`<div class="card"><h2>Kết quả: ${sc}/${qs.length}</h2><p>${end?end(sc,qs.length):""}</p><button class="btn" id="rr">Làm lại</button></div>`;$("#rr").onclick=()=>{i=0;sc=0;qs=sh(qs);show()};return}
    const q=qs[i];
    el.innerHTML=`<div class="card"><div class="muted">${q.sec?q.sec+" · ":""}Câu ${i+1}/${qs.length} · Điểm ${sc}</div>${q.pass?`<p class="pass">${q.pass}</p>`:""}<div class="${q.big?"big":"ques"}">${q.q}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>${q.hint?`<div class="row"><button class="btn ghost" id="hn">Gợi ý pinyin</button></div><div class="muted" id="hb"></div>`:""}<div id="fb"></div></div>`;
    if(q.hint)$("#hn").onclick=()=>{$("#hb").textContent=q.hint};
    let done=false;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(done)return;done=true;const k=+b.dataset.k;
      el.querySelectorAll(".opt")[q.a].classList.add("ok");
      if(k===q.a)sc++;else b.classList.add("bad");
      $("#fb").innerHTML=`<p>${k===q.a?"✅ Chính xác!":"❌ Chưa đúng."} ${q.ex||""}</p><button class="btn" id="nx">${i+1<qs.length?"Tiếp":"Xem kết quả"}</button>`;
      $("#nx").onclick=()=>{i++;show()};
    });
  };
  show();
}
function lines(el,txt,title){
  let pin=true,vi=true;
  const draw=()=>{
    el.innerHTML=`<div class="card"><h2>${title}</h2><div class="row" style="margin:0 0 8px"><button class="btn ${pin?"":"ghost"}" id="tp">Pinyin: ${pin?"có":"ẩn"}</button><button class="btn ${vi?"":"ghost"}" id="tv">Nghĩa: ${vi?"có":"ẩn"}</button></div>`+
    txt.split("\n").map(l=>{const [h,p,m]=l.split("|");return `<div class="ln"><div class="h">${h}</div>${pin?`<div class="p">${p}</div>`:""}${vi?`<div class="muted">${m}</div>`:""}</div>`}).join("")+`<p class="muted">Cách ôn: đọc khi có pinyin → ẩn pinyin và đọc lại → ẩn cả nghĩa để tự kiểm tra.</p></div>`;
    $("#tp").onclick=()=>{pin=!pin;draw()};$("#tv").onclick=()=>{vi=!vi;draw()};
  };draw();
}

/* ===== MODES ===== */
function cards(el){
  let deck=sh(ws(S.l)),i=0,flip=false,miss=[],pp=false;
  const show=()=>{
    if(i>=deck.length){el.innerHTML=`<div class="card"><h2>Xong ${deck.length} thẻ!</h2><p>Chưa nhớ: ${miss.length}</p><div class="row">${miss.length?`<button class="btn" id="rm">Ôn lại từ chưa nhớ</button>`:""}<button class="btn ghost" id="ra">Học lại từ đầu</button></div></div>`;
      if(miss.length)$("#rm").onclick=()=>{deck=sh(miss);miss=[];i=0;show()};$("#ra").onclick=()=>{deck=sh(ws(S.l));miss=[];i=0;show()};return}
    const w=deck[i];
    el.innerHTML=`<div class="muted">Thẻ ${i+1}/${deck.length}</div><div class="card fc" id="fc">${flip?`<div class="hz" style="font-size:34px">${w.h}</div><div style="font-size:24px;color:var(--ac)">${w.p}</div><div style="font-size:20px">${w.m}</div>`:`<div class="hz">${w.h}</div>${pp?`<div class="muted">${w.p}</div>`:`<div class="muted">chạm để lật</div>`}`}</div><div class="row"><button class="btn ghost" id="no">Chưa nhớ</button><button class="btn" id="ok">Đã nhớ</button><button class="btn ghost" id="pp">${pp?"Ẩn":"Hiện"} pinyin mặt trước</button></div>`;
    $("#fc").onclick=()=>{flip=!flip;show()};
    $("#pp").onclick=()=>{pp=!pp;show()};
    $("#ok").onclick=()=>{i++;flip=false;show()};
    $("#no").onclick=()=>{miss.push(w);i++;flip=false;show()};
  };show();
}
function quiz(el){
  el.innerHTML=`<div class="row" style="margin:0 0 10px"><button class="btn" data-d="h2m">汉字 → Nghĩa</button><button class="btn ghost" data-d="m2h">Nghĩa → 汉字</button><button class="btn ghost" data-d="mix">Trộn</button></div><div id="qa"></div>`;
  const run=d=>{el.querySelectorAll("[data-d]").forEach(b=>b.className="btn"+(b.dataset.d===d?"":" ghost"));
    const words=ws(S.l);mcq($("#qa"),sh(words).slice(0,S.l>=100?15:10).map((w,i)=>vq(w,d==="mix"?(i%2?"m2h":"h2m"):d,words)),(s,n)=>s>=n*.8?"Tuyệt vời! 🎉":"Cố gắng ôn thêm nhé!")};
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>run(b.dataset.d));run("h2m");
}
function grammar(el){
  const ls=S.l>=100?[3*(S.l-100)-2,3*(S.l-100)-1,3*(S.l-100)]:[S.l];
  el.innerHTML=ls.map(l=>`<div class="card"><h2>${S.l>=100?"Bài "+l+": ":""}${G[l][0]}</h2><p>${G[l][1]}</p></div>`).join("")+`<div id="gq"></div>`;
  mcq($("#gq"),ls.map(l=>{const g=G[l],opts=[g[3],...g[4]];return mk(g[2].replace("＿","＿＿"),g[3],g[4],{hint:opts.map(o=>o+" = "+(py(o)||"")).join("  ·  "),ex:g[2].replace("＿",g[3])})}));
}
function text(el){ T[S.l]?lines(el,T[S.l],"Bài khóa (bản rút gọn theo chủ đề bài)"):el.innerHTML=`<div class="card">Bài khóa bài ${S.l} chưa được thêm.</div>`}
function reading(el){
  const r=R[S.l];if(!r){el.innerHTML=`<div class="card">Bài đọc thêm cho bài ${S.l} chưa được thêm.</div>`;return}
  el.innerHTML=`<div id="rl"></div><div id="rq"></div>`;lines($("#rl"),r[0],"Bài đọc thêm");
  mcq($("#rq"),[mk(r[1],r[2],r[3])]);
}
function writing(el){
  const words=ws(S.l);let idx=0,guide=true,strokes=[],cur=null;
  el.innerHTML=`<div class="card"><div class="chips" id="wc">${words.map((w,k)=>`<button class="chip" data-k="${k}">${w.h}</button>`).join("")}</div><div id="wi"></div><canvas id="cv" width="560" height="280"></canvas><div class="row"><button class="btn" id="cl">Xóa</button><button class="btn ghost" id="gd">Nét mẫu: bật/tắt</button><button class="btn ghost" id="nx">Từ tiếp</button></div></div>`;
  const cv=$("#cv"),c=cv.getContext("2d");
  const paint=()=>{
    c.clearRect(0,0,560,280);const fg=getComputedStyle(document.body).color;
    c.strokeStyle="rgba(128,128,128,.3)";c.setLineDash([6,6]);c.beginPath();c.moveTo(280,0);c.lineTo(280,280);c.moveTo(0,140);c.lineTo(560,140);c.stroke();c.setLineDash([]);
    const w=words[idx];
    if(guide){c.font=`${Math.min(220,520/w.h.length)}px "Noto Serif SC","Songti SC",serif`;c.textAlign="center";c.textBaseline="middle";c.globalAlpha=.18;c.fillStyle=fg;c.fillText(w.h,280,145);c.globalAlpha=1}
    c.strokeStyle=fg;c.lineWidth=7;c.lineCap="round";c.lineJoin="round";
    strokes.forEach(s=>{c.beginPath();s.forEach((p,k)=>k?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(s.length===1)c.lineTo(s[0][0]+.1,s[0][1]);c.stroke()});
  };
  const info=()=>{const w=words[idx];$("#wi").innerHTML=`<div class="muted">${idx+1}/${words.length}</div><div><b>${w.p}</b> – ${w.m}</div>`;el.querySelectorAll(".chip").forEach((b,k)=>b.classList.toggle("on",k===idx))};
  const go=k=>{idx=k;strokes=[];info();paint()};
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*560/r.width,(e.clientY-r.top)*280/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);paint()};
  cv.onpointermove=e=>{if(cur){cur.push(pt(e));paint()}};
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};
  $("#cl").onclick=()=>{strokes=[];paint()};
  $("#gd").onclick=()=>{guide=!guide;paint()};
  $("#nx").onclick=()=>go((idx+1)%words.length);
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>go(+b.dataset.k));
  go(0);
}
let P={};try{P=JSON.parse(localStorage.getItem("hsk1p")||"{}")}catch(e){}
function typing(el){
  const words=ws(S.l);let cur=null,mode="p",ans=false;
  const stat=w=>{const p=P[w.h]||{};return p.st>=2?2:(p.ok||p.no)?1:0};
  const save=()=>{try{localStorage.setItem("hsk1p",JSON.stringify(P))}catch(e){}};
  const pick=()=>{const un=words.filter(w=>stat(w)<2),pool=un.length?un:words;let c;do{c=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&cur&&c.h===cur.h);return c};
  const draw=()=>{
    const done=words.filter(w=>stat(w)===2).length;
    el.innerHTML=`<div class="card"><div class="muted">Đã thuộc ${done}/${words.length} từ (gõ đúng liên tiếp 2 lần)</div><div style="height:8px;background:var(--line);border-radius:6px;margin:6px 0 10px"><div style="height:8px;width:${done/words.length*100}%;background:var(--ok);border-radius:6px"></div></div><div class="row" style="margin:0 0 10px"><button class="btn ${mode==="p"?"":"ghost"}" id="m1">Pinyin + nghĩa</button><button class="btn ${mode==="m"?"":"ghost"}" id="m2">Chỉ nghĩa (khó hơn)</button></div><div class="ques">${mode==="p"?`<b style="color:var(--ac);font-size:28px">${cur.p}</b> – `:""}${cur.m}</div><input id="in" lang="zh" autocomplete="off" placeholder="Gõ pinyin bằng bàn phím tiếng Trung để ra chữ Hán" style="width:100%;font-size:26px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"><div class="row"><button class="btn" id="ck">Kiểm tra</button></div><div id="fb"></div></div><div class="card"><div class="muted">🟢 đã thuộc · 🟡 đang học · ⚪ chưa thử (bấm vào từ để luyện riêng)</div><div class="chips" style="margin-top:8px">${words.map(w=>`<button class="chip" data-h="${w.h}">${["⚪","🟡","🟢"][stat(w)]} ${w.h}</button>`).join("")}</div><button class="btn ghost" id="rs">Xóa tiến độ các từ này</button></div>`;
    $("#m1").onclick=()=>{mode="p";ans=false;draw()};$("#m2").onclick=()=>{mode="m";ans=false;draw()};
    $("#ck").onclick=check;
    $("#in").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();ans?next():check()}};
    el.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{cur=words.find(w=>w.h===b.dataset.h);ans=false;draw()});
    $("#rs").onclick=()=>{words.forEach(w=>delete P[w.h]);save();ans=false;draw()};
    $("#in").focus();
  };
  const next=()=>{cur=pick();ans=false;draw()};
  const check=()=>{
    if(ans)return;const v=$("#in").value.replace(/\s/g,"");if(!v)return;ans=true;
    const p=P[cur.h]=P[cur.h]||{ok:0,no:0,st:0},right=v===cur.h;
    if(right){p.ok++;p.st++}else{p.no++;p.st=0}
    save();
    $("#fb").innerHTML=`<p>${right?"✅ Đúng rồi!":"❌ Chưa đúng. Đáp án: <b>"+cur.h+"</b> ("+cur.p+")"} · Đúng liên tiếp: ${p.st}/2${p.st>=2?" → đã thuộc 🟢":""}</p><button class="btn" id="nx">Từ tiếp (Enter)</button>`;
    $("#nx").onclick=next;
  };
  next();
}
function mock(el){
  const pool=sh(W).slice(0,20);
  const qs=pool.map((w,i)=>({...vq(w,i<12?"h2m":"m2h",W),sec:"Phần 1 · Từ vựng (không pinyin)"}));
  MOCK.slice(1).forEach(m=>qs.push({...mk(m[0],m[1],m[2],{ex:""}),pass:MOCK[0],sec:"Phần 2 · Đọc hiểu (không pinyin)"}));
  el.innerHTML=`<div class="card"><h2>🏆 Thi thử tổng hợp 15 bài</h2><p class="muted">20 câu từ vựng lấy ngẫu nhiên từ cả 15 bài, sau đó 1 bài đọc 3 câu. Không có pinyin.</p></div><div id="mq"></div>`;
  mcq($("#mq"),qs,(s,n)=>s>=n*.85?"Rất tốt, sẵn sàng thi! 🎉":s>=n*.6?"Khá ổn, ôn thêm các bài còn sai nhé.":"Cần ôn lại từ vựng từng bài.");
}

/* ===== APP ===== */
const S={l:1,t:"cards"};
const TABS=[["cards","1 Flashcard",cards],["quiz","2 Quiz từ",quiz],["gram","3 Ngữ pháp",grammar],["text","4 Bài khóa",text],["read","5 Bài đọc",reading],["write","6 Luyện viết",writing],["type","7 Gõ chữ Hán",typing]];
function render(){
  $("#ls").innerHTML=Array.from({length:15},(_,k)=>`<button class="chip ${S.l===k+1?"on":""}" data-l="${k+1}">Bài ${k+1}</button>`+((k+1)%3?"":`<button class="chip ${S.l===100+(k+1)/3?"on":""}" data-l="${100+(k+1)/3}">🔁 Ôn ${k-1}–${k+1}</button>`)).join("")+`<button class="chip ${S.l===0?"on":""}" data-l="0">🏆 Tổng hợp</button>`;
  const tl=S.l>=100?TABS.filter(t=>!["text","read"].includes(t[0])):TABS;if(S.l>=100&&!tl.some(t=>t[0]===S.t))S.t="cards";
  $("#tb").innerHTML=S.l?tl.map(t=>`<button class="tab ${S.t===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join(""):"";
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.l=+b.dataset.l;render()});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.t=b.dataset.t;render()});
  const el=$("#app");el.innerHTML="";
  S.l?tl.find(t=>t[0]===S.t)[2](el):mock(el);
}
render();
</script>
